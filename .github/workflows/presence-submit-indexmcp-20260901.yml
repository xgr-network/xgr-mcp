name: Presence Submit IndexMCP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/presence-submit-indexmcp-20260901.yml'

jobs:
  submit:
    if: contains(github.event.head_commit.message, '[presence-submit-indexmcp]')
    runs-on: ubuntu-latest
    steps:
      - name: Submit XGR MCP Gateway exactly once
        shell: bash
        run: |
          set -euo pipefail
          payload='{"name":"XGR MCP Gateway","github_url":"https://github.com/xgr-network/xgr-mcp","description":"Open-source MCP gateway for XGR.Network, exposing XGRChain, XDaLa sessions, Explorer evidence and XRC standards to MCP-compatible AI agents.","category":"Code & Dev","compatibility":["Other"],"submitter_email":"info@xgr.network"}'
          status=$(curl --silent --show-error --output /tmp/body.json --write-out '%{http_code}' --request POST 'https://indexmcp.co/api/submit' --header 'Content-Type: application/json' --data "$payload")
          echo "HTTP_STATUS=$status"
          echo 'RESPONSE_BODY_BEGIN'
          cat /tmp/body.json
          echo
          echo 'RESPONSE_BODY_END'
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then exit 1; fi
