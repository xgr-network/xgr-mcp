name: Presence execute qualified forms 2026-09-02
on:
  push:
    paths:
      - '.github/workflows/presence-execute-forms-20260902.yml'
jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Submit Private Markets entry exactly once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error, json
          endpoint='https://directory.private-markets.com/api/submit'
          payload={
            'company_url':'',
            'companyName':'XGR.Network GmbH',
            'website':'https://xgr.network',
            'categories':'AI & Workflow Automation',
            'description':'XGR.Network develops XGRChain, a public EVM-compatible blockchain execution and settlement layer, and XDaLa, a process validation and orchestration layer for auditable workflows using rules, external data, smart contracts and human approvals.',
            'region':'Germany',
            'contactName':'Oliver Böhm',
            'contactEmail':'info@xgr.network'
          }
          data=json.dumps(payload,ensure_ascii=False).encode('utf-8')
          req=urllib.request.Request(endpoint,data=data,method='POST',headers={
            'User-Agent':'Mozilla/5.0 XGR-Presence/1.0',
            'Content-Type':'application/json',
            'Accept':'application/json,text/plain,*/*',
            'Origin':'https://directory.private-markets.com',
            'Referer':'https://directory.private-markets.com/submit'
          })
          try:
            with urllib.request.urlopen(req,timeout=30) as r:
              body=r.read().decode('utf-8','replace')
              print('PRIVATE_SUBMIT_STATUS',r.status)
              print('PRIVATE_SUBMIT_FINAL',r.geturl())
              print('PRIVATE_SUBMIT_CONTENT_TYPE',r.headers.get('content-type',''))
              for h in ['x-request-id','x-vercel-id','location']:
                if r.headers.get(h): print('PRIVATE_HEADER',h,r.headers.get(h))
              print('PRIVATE_SUBMIT_BODY',body[:3000])
          except urllib.error.HTTPError as e:
            body=e.read().decode('utf-8','replace')
            print('PRIVATE_SUBMIT_HTTP_ERROR',e.code)
            print('PRIVATE_SUBMIT_CONTENT_TYPE',e.headers.get('content-type',''))
            for h in ['x-request-id','x-vercel-id','location']:
              if e.headers.get(h): print('PRIVATE_HEADER',h,e.headers.get(h))
            print('PRIVATE_SUBMIT_ERROR_BODY',body[:3000])
          PY
