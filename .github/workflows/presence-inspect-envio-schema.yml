name: Presence Inspect Envio Schema

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/presence-inspect-envio-schema.yml'

jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[presence-envio-schema]')
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact requestNetworkSupport schema
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://envio.dev/_next/static/chunks/pages/request_network-bf9910ff89bb4f5b.js' -o /tmp/page.js
          python3 - <<'PY'
          s=open('/tmp/page.js',encoding='utf-8').read()
          for needle in ['cofundWillingness','requestNetworkSupport']:
              i=s.find(needle)
              print('NEEDLE',needle,'INDEX',i)
              if i>=0:
                  print(s[max(0,i-1800):i+2200])
          PY
