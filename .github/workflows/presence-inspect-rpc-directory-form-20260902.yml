name: Presence Inspect RPC Directory Form

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/presence-inspect-rpc-directory-form-20260902.yml'

jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[presence-inspect-rpc-directory]')
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current Google Form structure
        shell: bash
        run: |
          set -euo pipefail
          URL='https://docs.google.com/forms/d/e/1FAIpQLSdBSySY9LZTypSn4CXQx72FLU07iWBImZMMZ1HNSEN6CMQK7g/viewform'
          curl -fsSL "$URL" -o /tmp/form.html
          python3 - <<'PY'
          import re, html
          s=open('/tmp/form.html',encoding='utf-8',errors='ignore').read()
          print('FORM_ACTIONS')
          for m in re.findall(r'<form[^>]+action="([^"]+)"[^>]*>',s,re.I): print(html.unescape(m))
          print('ENTRY_NAMES')
          for x in sorted(set(re.findall(r'name="(entry\.[0-9]+)"',s))): print(x)
          print('FORM_RESPONSE_PRESENT', 'formResponse' in s)
          print('CAPTCHA_PRESENT', bool(re.search(r'recaptcha|hcaptcha|turnstile',s,re.I)))
          print('SIGNIN_TEXT_PRESENT', bool(re.search(r'sign in|required to sign|anmelden|login required',s,re.I)))
          print('FB_PUBLIC_LOAD_DATA_SNIPPET')
          i=s.find('FB_PUBLIC_LOAD_DATA_')
          print(s[i:i+12000] if i>=0 else 'NOT_FOUND')
          PY
