name: Presence MCP Registry readback 2026-09-12

on:
  push:
    paths:
      - .github/workflows/presence-mcp-registry-readback-20260912.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Query official MCP Registry for XGR server
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          name = 'io.github.xgr-network/xdala-workflow-builder'
          url = 'https://registry.modelcontextprotocol.io/v0.1/servers?' + urllib.parse.urlencode({'search': name, 'version': 'latest', 'limit': '20'})
          req = urllib.request.Request(url, headers={'Accept':'application/json','User-Agent':'XGR-Presence-Registry-Readback/1.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              body = r.read().decode('utf-8','replace')
              print('MCP_REGISTRY_STATUS', r.status)
              print('MCP_REGISTRY_URL', url)
              print('MCP_REGISTRY_BODY', body[:20000])
              data = json.loads(body)
              low = body.lower()
              found = name.lower() in low and 'mcp.xgr.network' in low
              print('MCP_REGISTRY_XGR_FOUND', 'true' if found else 'false')
              if not found:
                  raise SystemExit(4)
          PY
