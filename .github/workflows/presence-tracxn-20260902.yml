name: Presence Tracxn 2026-09-02
on:
  push:
    paths:
      - '.github/workflows/presence-tracxn-20260902.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Tracxn startup form
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.parse, re
          base='https://tracxn.com/listyourstartup'
          req=urllib.request.Request(base,headers={'User-Agent':'Mozilla/5.0 XGR-Presence/1.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              html=r.read().decode('utf-8','replace'); final=r.geturl(); print('PAGE_STATUS',r.status,'FINAL',final)
          forms=re.findall(r'<form\b[^>]*>.*?</form>',html,re.I|re.S)
          print('FORMS',len(forms))
          for i,f in enumerate(forms):
              head=re.search(r'<form\b([^>]*)>',f,re.I|re.S)
              print('FORM',i,re.sub(r'\s+',' ',head.group(1))[:2500] if head else '')
              for m in re.finditer(r'<(?:input|select|textarea|button)\b([^>]*)>',f,re.I|re.S):
                  print('CONTROL',re.sub(r'\s+',' ',m.group(1))[:2500])
          for pat in ['listyourstartup','companyName','businessEmail','additionalDetails','terms','captcha','recaptcha','turnstile','honeypot','submit']:
              for m in list(re.finditer(pat,html,re.I))[:5]:
                  print('HTML_KEY',pat,'CONTEXT',re.sub(r'\s+',' ',html[max(0,m.start()-1200):m.start()+2400])[:5000])
          srcs=re.findall(r"<script[^>]+src=['\"]([^'\"]+)",html,re.I)
          print('SCRIPTS',len(srcs))
          for s in srcs:
              u=urllib.parse.urljoin(final,s)
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as rr: js=rr.read().decode('utf-8','replace')
                  low=js.lower()
                  if any(k in low for k in ['listyourstartup','company name','business email','additional details','recaptcha','captcha','/api/']):
                      print('MATCH_SCRIPT',u)
                      for key in ['listyourstartup','Company Name','Business email','Additional Details','recaptcha','captcha','/api/']:
                          p=low.find(key.lower())
                          if p>=0: print('KEY',key,'CONTEXT',js[max(0,p-3500):p+8000])
              except Exception as e: print('SCRIPT_ERROR',u,type(e).__name__,str(e))
          PY
