name: Presence Submit AllMCPs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/presence-submit-allmcps.yml'

jobs:
  submit:
    if: contains(github.event.head_commit.message, '[presence-submit-allmcps]')
    runs-on: ubuntu-latest
    steps:
      - name: Submit XGR MCP Gateway exactly once
        shell: bash
        run: |
          set -euo pipefail
          payload='{"name":"XGR MCP Gateway","url":"https://github.com/xgr-network/xgr-mcp","description":"Open-source MCP gateway for XGR.Network, exposing XGRChain and XDaLa workflows to MCP-compatible AI agents.","category":"Developer Tools","email":"info@xgr.network","tags":["blockchain","web3","evm","xgr","xdala"],"license":"Apache-2.0","authType":"none","pricingModel":"free","maintenanceStatus":"active","supportUrl":"https://xgr.network/docs/mcp_overview/"}'
          status=$(curl --silent --show-error --output /tmp/body.json --write-out '%{http_code}' --request POST 'https://allmcps.com/api/v1/submit' --header 'Content-Type: application/json' --data "$payload")
          echo "HTTP_STATUS=$status"
          echo 'RESPONSE_BODY_BEGIN'
          cat /tmp/body.json
          echo
          echo 'RESPONSE_BODY_END'
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
