name: Presence Submit RPC Directory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/presence-submit-rpc-directory-20260902.yml'

jobs:
  submit:
    if: contains(github.event.head_commit.message, '[presence-submit-rpc-directory]')
    runs-on: ubuntu-latest
    steps:
      - name: Submit XGRChain inclusion request exactly once
        shell: bash
        run: |
          set -euo pipefail
          URL='https://docs.google.com/forms/d/e/1FAIpQLSdBSySY9LZTypSn4CXQx72FLU07iWBImZMMZ1HNSEN6CMQK7g/formResponse'
          DETAILS='Please add XGRChain Mainnet to RPC Directory. Chain ID: 1643 (0x66b). Native currency: XGR, 18 decimals. Public RPC: https://rpc.xgr.network. Explorer: https://explorer.xgr.network. Website: https://xgr.network. Documentation: https://xgr.network/docs/. Canonical EVM chain metadata: https://github.com/ethereum-lists/chains/blob/master/_data/chains/eip155-1643.json. XGRChain is a public EVM-compatible Layer-1 network.'
          curl --silent --show-error --max-redirs 5 \
            --dump-header /tmp/headers.txt \
            --output /tmp/body.html \
            --write-out 'HTTP_STATUS=%{http_code}\nFINAL_URL=%{url_effective}\n' \
            --request POST "$URL" \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'emailAddress=info@xgr.network' \
            --data-urlencode 'entry.802554958='"$DETAILS" \
            > /tmp/status.txt
          cat /tmp/status.txt
          echo 'HEADERS_BEGIN'
          cat /tmp/headers.txt
          echo 'HEADERS_END'
          echo 'CONFIRMATION_BEGIN'
          python3 - <<'PY'
          from bs4 import BeautifulSoup
          s=BeautifulSoup(open('/tmp/body.html',encoding='utf-8',errors='ignore').read(),'html.parser')
          print('TITLE=', s.title.get_text(' ',strip=True) if s.title else '')
          text=' '.join(s.stripped_strings)
          print(text[:4000])
          PY
          echo 'CONFIRMATION_END'
