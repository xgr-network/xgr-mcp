name: Presence form inspect 2026-09-02
on:
  push:
    paths:
      - '.github/workflows/presence-form-inspect-20260902.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Private Markets submit implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.parse, re
          base='https://directory.private-markets.com/submit'
          req=urllib.request.Request(base,headers={'User-Agent':'Mozilla/5.0 XGR-Presence/1.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              html=r.read().decode('utf-8','replace')
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)',html,re.I)
          print('SCRIPT_COUNT',len(srcs))
          for s in srcs:
              u=urllib.parse.urljoin(base,s)
              try:
                  with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=30) as r:
                      js=r.read().decode('utf-8','replace')
                  if any(k in js for k in ['companyName','contactEmail','company_url','Submit a company']):
                      print('MATCH_SCRIPT',u)
                      for key in ['companyName','contactEmail','company_url']:
                          pos=js.find(key)
                          if pos>=0:
                              print('KEY',key,'CONTEXT',js[max(0,pos-1800):pos+3200])
              except Exception as e:
                  print('SCRIPT_ERROR',u,type(e).__name__,str(e))
          PY
