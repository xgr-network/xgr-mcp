name: Presence AgentSeal submission 2026-09-11

on:
  push:
    paths:
      - .github/workflows/presence-agentseal-submit-20260911.yml

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Duplicate-check and submit XGR MCP Gateway exactly once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time, urllib.parse, urllib.request, urllib.error

          base = 'https://agentseal.org'
          headers = {
              'User-Agent': 'agentseal-mcp-intel/0.1.0',
              'X-AgentSeal-Client': 'mcp-intel',
              'Accept': 'application/json',
          }

          q = urllib.parse.urlencode({'search': 'XGR', 'limit': '20'})
          req = urllib.request.Request(base + '/api/v1/mcp/intel?' + q, headers=headers)
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  raw = r.read().decode('utf-8', 'replace')
                  print('AGENTSEAL_SEARCH_STATUS', r.status)
                  print('AGENTSEAL_SEARCH_BODY', raw[:12000])
          except urllib.error.HTTPError as e:
              raw = e.read().decode('utf-8', 'replace')
              print('AGENTSEAL_SEARCH_HTTP_ERROR', e.code)
              print('AGENTSEAL_SEARCH_BODY', raw[:4000])
              raise SystemExit(2)

          low = raw.lower()
          if ('mcp.xgr.network' in low or 'xgr-network/xgr-mcp' in low or 'xgr mcp gateway' in low):
              print('AGENTSEAL_DUPLICATE_FOUND skip_submit')
              raise SystemExit(0)

          payload = json.dumps({
              'package_name': 'https://mcp.xgr.network/mcp',
              'package_type': 'remote',
          }).encode('utf-8')
          post_headers = dict(headers)
          post_headers['Content-Type'] = 'application/json'
          req = urllib.request.Request(base + '/api/v1/mcp/intel/submit', data=payload, method='POST', headers=post_headers)
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  body = r.read().decode('utf-8', 'replace')
                  print('AGENTSEAL_SUBMIT_STATUS', r.status)
                  print('AGENTSEAL_SUBMIT_BODY', body[:12000])
          except urllib.error.HTTPError as e:
              body = e.read().decode('utf-8', 'replace')
              print('AGENTSEAL_SUBMIT_HTTP_ERROR', e.code)
              print('AGENTSEAL_SUBMIT_BODY', body[:8000])
              raise SystemExit(3)

          try:
              data = json.loads(body)
          except Exception:
              raise SystemExit(0)
          submission_id = data.get('submission_id')
          if not submission_id:
              raise SystemExit(0)

          status_url = base + '/api/v1/mcp/intel/submit/' + urllib.parse.quote(str(submission_id), safe='')
          for i in range(6):
              time.sleep(10)
              try:
                  with urllib.request.urlopen(urllib.request.Request(status_url, headers=headers), timeout=20) as r:
                      sbody = r.read().decode('utf-8', 'replace')
                      print('AGENTSEAL_POLL', i + 1, r.status, sbody[:12000])
                      try:
                          sdata = json.loads(sbody)
                      except Exception:
                          continue
                      if sdata.get('status') in ('complete', 'failed'):
                          break
              except Exception as exc:
                  print('AGENTSEAL_POLL_ERROR', i + 1, type(exc).__name__, str(exc)[:500])
          PY
