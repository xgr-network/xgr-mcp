name: Presence Submit mcp-get

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/presence-submit-mcp-get.yml'

jobs:
  submit:
    if: contains(github.event.head_commit.message, '[presence-submit-mcp-get]')
    runs-on: ubuntu-latest
    steps:
      - name: Submit XGR MCP Gateway exactly once
        shell: bash
        run: |
          set -euo pipefail
          payload='{"name":"xgr-mcp-gateway","description":"Open-source MCP gateway for XGR.Network, exposing XGRChain and XDaLa workflows to MCP-compatible AI agents.","vendor":"XGR.Network GmbH","sourceUrl":"https://github.com/xgr-network/xgr-mcp","homepage":"https://xgr.network","license":"Apache-2.0"}'
          status=$(curl --silent --show-error --output /tmp/body.json --write-out '%{http_code}' --request POST 'https://mcp-get.com/api/servers/submit' --header 'Content-Type: application/json' --data "$payload")
          echo "HTTP_STATUS=$status"
          echo 'RESPONSE_BODY_BEGIN'
          cat /tmp/body.json
          echo
          echo 'RESPONSE_BODY_END'
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            exit 1
          fi
