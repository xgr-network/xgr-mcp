name: Presence Inspect BoltRPC Contact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/presence-inspect-boltrpc-20260901.yml'

jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[presence-inspect-boltrpc]')
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current BoltRPC contact implementation
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://boltrpc.io/contact' -o /tmp/page.html
          echo 'FORM_BEGIN'
          grep -ioE '<form[^>]*>|name="[^"]+"|action="[^"]+"|method="[^"]+"' /tmp/page.html | head -160 || true
          echo 'FORM_END'
          grep -oE 'src="[^"]+\.js[^" ]*"' /tmp/page.html | cut -d'"' -f2 | sort -u > /tmp/scripts.txt || true
          while IFS= read -r src; do
            [ -n "$src" ] || continue
            case "$src" in
              http*) url="$src" ;;
              //*) url="https:$src" ;;
              /*) url="https://boltrpc.io$src" ;;
              *) url="https://boltrpc.io/$src" ;;
            esac
            curl -fsSL "$url" -o /tmp/script.js || continue
            if grep -Eqi 'Message sent|contact|privacy|/api/|fetch\(' /tmp/script.js; then
              echo "SCRIPT=$url"
              python3 - <<'PY'
          s=open('/tmp/script.js',encoding='utf-8',errors='ignore').read()
          for needle in ['Message sent','Something went wrong','/api/','contact']:
              start=0
              for _ in range(8):
                  i=s.find(needle,start)
                  if i<0: break
                  print('\nNEEDLE',needle,'INDEX',i)
                  print(s[max(0,i-1800):i+3000])
                  start=i+len(needle)
          PY
            fi
          done < /tmp/scripts.txt
