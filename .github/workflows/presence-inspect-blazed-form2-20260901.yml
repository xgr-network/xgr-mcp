name: Presence Inspect BLAZED Form Details

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/presence-inspect-blazed-form2-20260901.yml'

jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[presence-inspect-blazed-form2]')
    runs-on: ubuntu-latest
    steps:
      - name: Inspect BLAZED waitlist form and button handler
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://blazed.sh/networks' -o /tmp/page.html
          echo 'HTML_WAITLIST_BEGIN'
          python3 - <<'PY'
          s=open('/tmp/page.html',encoding='utf-8',errors='ignore').read()
          for needle in ["name='waitlist'",'Request Network Support','form-name']:
              start=0
              for _ in range(8):
                  i=s.find(needle,start)
                  if i<0: break
                  print('\nNEEDLE',needle,'INDEX',i)
                  print(s[max(0,i-2200):i+5000])
                  start=i+len(needle)
          PY
          echo 'HTML_WAITLIST_END'
          curl -fsSL 'https://blazed.sh/assets/index-lZaUI1AF.js' -o /tmp/app.js
          echo 'JS_WAITLIST_BEGIN'
          python3 - <<'PY'
          s=open('/tmp/app.js',encoding='utf-8',errors='ignore').read()
          for needle in ['waitlist','Request Network Support','form-name','networkName','network_name','network support','Netlify']:
              start=0
              for _ in range(12):
                  i=s.lower().find(needle.lower(),start)
                  if i<0: break
                  print('\nNEEDLE',needle,'INDEX',i)
                  print(s[max(0,i-2600):i+5200])
                  start=i+len(needle)
          PY
          echo 'JS_WAITLIST_END'
